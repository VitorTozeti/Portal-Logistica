    <div id="pf-raiz"><div class="vazio">carregando…</div></div>

<script>
(function(){
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const AZURE = "https://ca-calculadora-frete.whitesky-9894e172.eastus.azurecontainerapps.io";
const GATE = window.PortalGate && PortalGate.ativo();
// Em servidor local (sem login) dá para apontar a API com ?api=http://127.0.0.1:8099 — só fora do Pages.
const API = (!GATE && new URLSearchParams(location.search).get("api")) || AZURE;
function toast(msg, o){ const t = document.createElement("div"); t.className = "toast" + (o && o.erro ? " erro" : ""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), (o && o.ms) || 5000); }
async function token(){ return GATE ? PortalGate.idToken() : "dev"; }
async function api(metodo, caminho, corpo){
  let r;
  try{
    r = await fetch(API + caminho, { method: metodo, headers: Object.assign({ "Authorization": "Bearer " + await token() },
      corpo ? {"Content-Type": "application/json"} : {}), body: corpo ? JSON.stringify(corpo) : undefined });
  }catch(e){ throw { status: 0, corpo: { erro: "Sem conexão com o servidor. Tente de novo." } }; }
  let j = {}; try{ j = await r.json(); }catch(_){}
  if(!r.ok) throw { status: r.status, corpo: j };
  return j;
}
const msgErro = e => (e && e.corpo && e.corpo.erro) || "Algo deu errado. Tente de novo.";

function icone(){ $("#tema").textContent = document.documentElement.getAttribute("data-theme") === "light" ? "☀️" : "🌙"; }
$("#tema").onclick = () => { const n = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", n); try{ localStorage.setItem("portal_tema", n); }catch(_){} icone(); };
icone();
document.addEventListener("keydown", e => { if(e.key === "Escape") document.querySelectorAll(".mdl").forEach(m => m.hidden = true); });

// Excluir: permissão pedidos_excluir (TI). Sem login (servidor local): libera.
function iniciar(u){
  $("#eu").textContent = u && u.email ? u.email : "";
  PedidosFretes.montar($("#pf-raiz"), { api, toast, msgErro, podeExcluir: !GATE || PortalGate.pode("pedidos_excluir") });
}
if(GATE) PortalGate.pronto.then(u => { if(u) iniciar(u); });
else iniciar({ email: "servidor local" });
})();
</script>
