<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esqueci a senha — Portal da Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./auth.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./portal-auth.js"></script>
<script src="./auth-ui.js"></script>
</head>
<body>
  <form class="card" id="form" autocomplete="on" novalidate>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>
      </span>
      <span><b>Portal da Logística</b></span>
    </div>
    <h1>Esqueci a senha</h1>
    <p class="sub">Digite seu e-mail e enviaremos um link para criar uma nova senha.</p>

    <label for="email">E-mail</label>
    <input id="email" name="username" type="text" inputmode="email" autocapitalize="none"
           autocomplete="username" spellcheck="false" required autofocus>

    <button class="entrar" id="btn" type="submit">Enviar link →</button>
    <div class="aviso" id="aviso" role="alert" aria-live="polite"></div>

    <div class="rodape"><a href="./login.html" id="lnk-login">← Voltar para o login</a></div>
  </form>

  <script>
    AuthUI.tema();
    const $ = AuthUI.$;
    $("#lnk-login").href = AuthUI.comNext("./login.html");
    if (!(window.PortalGate && PortalGate.ativo())) { location.replace("./login.html"); }
    else {
      let espera = 0, timer = null;
      const contar = () => {
        const b = $("#btn");
        if (espera > 0) { b.disabled = true; b.textContent = "Reenviar em " + espera + " s"; espera--; timer = setTimeout(contar, 1000); }
        else { b.disabled = false; b.textContent = "Reenviar link →"; }
      };
      $("#form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const em = $("#email").value.trim();
        AuthUI.aviso($("#aviso"), "", ""); AuthUI.dica($("#email"), "");
        if (!AuthUI.emailOk(em)) { AuthUI.dica($("#email"), "Digite um e-mail válido."); $("#email").focus(); return; }
        AuthUI.carregando($("#btn"), true, "Enviando…");
        try { await PortalGate.redefinirSenha(em); } catch (_) { /* não revela se o e-mail existe */ }
        AuthUI.aviso($("#aviso"), "ok", "Se este e-mail tem conta, o link já está a caminho. Confira também a caixa de spam.");
        espera = 30; clearTimeout(timer); contar();
      });
    }
  </script>
</body>
</html>
