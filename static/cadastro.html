<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — Portal da Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./auth.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./portal-auth.js?v=20261009"></script>
<script src="./auth-ui.js?v=20261009"></script>
</head>
<body>
  <form class="card" id="form" autocomplete="on" novalidate>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>
      </span>
      <span><b>Portal da Logística</b></span>
    </div>
    <h1>Criar conta</h1>
    <p class="sub">Use o e-mail da empresa que o TI autorizou. Você escolhe a própria senha.</p>

    <label for="email">E-mail</label>
    <input id="email" name="username" type="text" inputmode="email" autocapitalize="none"
           autocomplete="username" spellcheck="false" required autofocus>

    <label for="senha">Senha</label>
    <input id="senha" name="new-password" type="password" autocomplete="new-password" required>
    <div class="forca" id="forca" data-n="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="forca-txt" id="forca-txt" aria-live="polite">Mínimo de 6 caracteres. Misture letras e números.</div>

    <label for="senha2">Repita a senha</label>
    <input id="senha2" name="new-password-confirm" type="password" autocomplete="new-password" required>

    <button class="entrar" id="btn" type="submit">Criar conta →</button>
    <div class="aviso" id="aviso" role="alert" aria-live="assertive"></div>

    <div class="rodape">Já tem conta? <a href="./login.html" id="lnk-login">Entrar</a></div>
  </form>

  <script>
    AuthUI.tema();
    const $ = AuthUI.$;
    $("#lnk-login").href = AuthUI.comNext("./login.html");
    if (!(window.PortalGate && PortalGate.ativo())) { location.replace("./login.html"); }
    else {
      AuthUI.olho($("#senha")); AuthUI.olho($("#senha2"));
      $("#senha").addEventListener("input", () => {
        const n = AuthUI.forca($("#senha").value);
        $("#forca").dataset.n = n;
        $("#forca-txt").textContent = n ? "Senha: " + AuthUI.FORCA_TXT[n] : "Mínimo de 6 caracteres. Misture letras e números.";
      });
      $("#senha2").addEventListener("input", () => {
        AuthUI.dica($("#senha2"), $("#senha2").value && $("#senha2").value !== $("#senha").value ? "As senhas não são iguais." : "");
      });
      PortalGate.pronto.then((u) => { if (u) location.replace(AuthUI.destino()); });

      $("#form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const em = $("#email").value.trim(), s1 = $("#senha").value, s2 = $("#senha2").value;
        AuthUI.aviso($("#aviso"), "", "");
        ["#email", "#senha", "#senha2"].forEach(i => AuthUI.dica($(i), ""));
        if (!AuthUI.emailOk(em)) { AuthUI.dica($("#email"), "Digite um e-mail válido."); $("#email").focus(); return; }
        if (s1.length < 6) { AuthUI.dica($("#senha"), "A senha precisa ter pelo menos 6 caracteres."); $("#senha").focus(); return; }
        if (s1 !== s2) { AuthUI.dica($("#senha2"), "As senhas não são iguais."); $("#senha2").focus(); return; }
        AuthUI.carregando($("#btn"), true, "Criando conta…");
        try {
          await PortalGate.cadastrar(em, s1);
          AuthUI.aviso($("#aviso"), "ok", "Conta criada! Entrando…");
          location.replace(AuthUI.destino());
        } catch (x) {
          AuthUI.carregando($("#btn"), false, "Criar conta →");
          AuthUI.aviso($("#aviso"), "erro", AuthUI.msgErro(x, "cadastro"));
        }
      });
    }
  </script>
</body>
</html>
