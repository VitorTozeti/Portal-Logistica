<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Portal da Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./portal-auth.js"></script>
<script>
  // Mesma barra do portal: no Pages a página fica oculta até o Firebase confirmar o login.
  if (window.PortalGate && PortalGate.ativo()) {
    document.documentElement.classList.add("gate-pend");
    PortalGate.pronto.then(function (u) {
      if (!u) location.replace("./login.html?next=" + encodeURIComponent("./painel.html"));
      else document.documentElement.classList.remove("gate-pend");
    });
  }
</script>
<script>
  (function(){
    try{ var t = localStorage.getItem("portal_tema");
      if(!t){ t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
      document.documentElement.setAttribute("data-theme", t);
    }catch(_){ document.documentElement.setAttribute("data-theme","dark"); }
  })();
</script>
<style>
  :root, :root[data-theme="dark"]{ --p1:#0e0d0d; --p2:#242424; --p3:#005b6b; --p4:#31cceb; --p5:#ffffff; }
  :root[data-theme="light"]{ --p1:#eff3f9; --p2:#ffffff; --p3:#cbd5e1; --p4:#1d4ed8; --p5:#0f172a; }
  :root{ --bg:var(--p1); --card:var(--p2); --ink:var(--p5); --line:var(--p3); --brand:var(--p4); --soft:color-mix(in srgb,var(--p5) 62%,transparent); }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;scrollbar-width:none} ::-webkit-scrollbar{width:0;height:0}
  body{margin:0;font:15px 'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column}
  html.gate-pend body > *{visibility:hidden}
  html.gate-pend body::before{content:"";position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
    border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--card);border-bottom:2px solid var(--brand)}
  header b{font-size:16px;color:var(--brand)} .esp{margin-left:auto}
  .eu{font-size:12.5px;color:var(--soft);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{font:inherit;color:var(--ink)}
  .tema-btn,.sair{height:34px;border-radius:17px;cursor:pointer;background:transparent;border:1px solid color-mix(in srgb,var(--brand) 45%,transparent)}
  .tema-btn{width:34px;font-size:16px} .sair{padding:0 14px;font-size:13px;font-weight:600}
  .tema-btn:hover,.sair:hover{background:color-mix(in srgb,var(--brand) 14%,transparent)}
  main{width:100%;max-width:1100px;margin:0 auto;padding:34px 24px 60px;flex:1}
  h1{font-size:24px;margin:0 0 6px} .sub{margin:0 0 26px;color:var(--soft);font-size:14.5px;line-height:1.5}
  h2.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:30px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:20px;transition:transform .12s,border-color .12s,box-shadow .12s}
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 26px rgba(0,0,0,.28);outline:none}
  .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;
    background:color-mix(in srgb,var(--brand) 16%,transparent)}
  .card b{font-size:16px} .card p{margin:0;color:var(--soft);font-size:13.5px;line-height:1.5;flex:1}
  .card .ir{color:var(--brand);font-weight:700;font-size:13.5px}
  .vazio{border:2px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--soft)}
  .vazio b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
  footer{padding:14px 20px;text-align:center;font-size:12px;color:var(--soft);border-top:1px solid var(--line)}
  @media (max-width:640px){main{padding:22px 14px 40px} h1{font-size:20px} .eu{display:none} header{padding:12px 14px}}
</style>
</head>
<body>
<header>
  <b>Portal da Logística</b>
  <span class="esp"></span>
  <span class="eu" id="eu"></span>
  <button type="button" class="tema-btn" id="tema" aria-label="Alternar tema claro/escuro" title="Alternar tema">🌙</button>
  <button type="button" class="sair" id="sair">Sair</button>
</header>
<main>
  <h1 id="ola">Painel de ferramentas</h1>
  <p class="sub">Escolha a ferramenta que você precisa. O que aparece aqui é o que o TI liberou para o seu usuário.</p>
  <div id="corpo"></div>
</main>
<footer>Pharmaesthetics · Logística</footer>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const card = f => '<a class="card" href="' + esc(f.href) + '"><span class="ic" aria-hidden="true">' + f.icone + "</span><b>" + esc(f.nome) + "</b><p>" + esc(f.desc) + '</p><span class="ir">Abrir →</span></a>';
function montar(u){
  const nome = (u.email || "").split("@")[0].split(/[._-]+/)[0] || "";
  $("#eu").textContent = u.email || "";
  $("#ola").textContent = nome ? "Olá, " + nome.charAt(0).toUpperCase() + nome.slice(1) : "Painel de ferramentas";
  const minhas = PortalGate.ferramentas().filter(f => PortalGate.podeFerramenta(f.id));
  let h = minhas.length ? '<div class="grid">' + minhas.map(card).join("") + "</div>"
    : '<div class="vazio"><b>Nenhuma ferramenta liberada ainda</b>Peça ao TI para liberar o seu usuário.</div>';
  if(u.perfil === "ti") h += '<h2 class="sec">Administração</h2><div class="grid">' + card(PortalGate.ferramentaTI()) + "</div>";
  $("#corpo").innerHTML = h;
}
function icone(){ $("#tema").textContent = document.documentElement.getAttribute("data-theme") === "light" ? "☀️" : "🌙"; }
$("#tema").onclick = () => { const n = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", n); try{ localStorage.setItem("portal_tema", n); }catch(_){} icone(); };
icone();
if(window.PortalGate && PortalGate.ativo()){
  $("#sair").onclick = async () => { await PortalGate.sair(); try{ sessionStorage.removeItem("portal_acesso_ok"); }catch(_){} location.replace("./login.html"); };
  PortalGate.pronto.then(u => { if(u) montar(u); });
} else {   // servidor interno/localhost: sem login — mostra tudo
  $("#sair").hidden = true;
  const fs = [{id:"monitor", nome:"Monitor de NFs", icone:"📦", href:"./index.html", desc:"Notas que subiram e as travadas."}];
  $("#corpo").innerHTML = '<div class="grid">' + fs.map(card).join("") + "</div>";
}
})();
</script>
</body>
</html>
