<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Portal da Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 🎨 PALETA — as MESMAS 5 cores do portal (mesma regra: --p5 = letras). Espelha o index.html. */
  :root{
    --p1:#020202; --p2:#19191a; --p3:#373739; --p4:#60d4ea; --p5:#9ae5f3;
    --bg1:var(--p1); --bg2:var(--p2); --card:var(--p2); --line:var(--p3);
    --ink:var(--p5); --ink2:var(--p5); --teal:var(--p4); --teal2:var(--p4);
    --field:var(--p2); --purple:var(--p4); --err:var(--p5);
  }
  *{box-sizing:border-box}
  html,body{scrollbar-width:none;-ms-overflow-style:none}   /* barra de rolagem oculta — visual limpo */
  ::-webkit-scrollbar{width:0;height:0;background:transparent}
  body{margin:0;min-height:100vh;font:15px 'Montserrat',system-ui,-apple-system,Segoe UI,sans-serif;
    color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg1)}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:28px 28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--teal),var(--teal2));box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .logo svg{width:24px;height:24px}
  .brand b{font-size:17px;display:block;line-height:1.2}
  .brand small{font-size:12.5px;color:var(--ink2)}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=password]{width:100%;background:var(--field);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:12px 13px;font:inherit;outline:none}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--p4) 30%,transparent)}
  .entrar{width:100%;margin-top:20px;border:0;border-radius:9px;padding:13px;cursor:pointer;
    font:inherit;font-weight:700;font-size:15px;color:var(--p1);
    background:linear-gradient(150deg,var(--teal),var(--teal2))}
  .entrar:hover{filter:brightness(1.06)}
  .perfil{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .perfil button{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    background:var(--field);border:1px solid var(--line);border-radius:9px;padding:11px;
    font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2)}
  .perfil button .ico{font-size:15px}
  .perfil button[aria-pressed=true]{color:var(--ink);border-color:var(--teal);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--p4) 30%,transparent) inset}
  .perfil button[data-perfil=logistica] .ico{color:var(--purple)}
  .perfil button[data-perfil=ti] .ico{color:var(--teal)}
  .erro{margin-top:14px;font-size:13px;color:var(--err);text-align:center;display:none}
  .erro.show{display:block}
  .foot{margin-top:20px;font-size:12px;color:var(--ink2);text-align:center;line-height:1.6}
  .foot b{color:var(--teal2)}
</style>
<script src="./portal-auth.js"></script>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="on">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--p1)" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4-8 4-8-4z"/>
          <path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>
      </span>
      <span>
        <b>Portal da Logística</b>
        <small>Acesso restrito · Logística e TI</small>
      </span>
    </div>

    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" type="text" autocapitalize="none"
           autocomplete="username" spellcheck="false" required>

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password"
           autocomplete="current-password" required>

    <input type="hidden" id="perfil" name="perfil" value="logistica">
    <button class="entrar" type="submit">Entrar no portal →</button>

    <div class="perfil" role="group" aria-label="Perfil de acesso">
      <button type="button" data-perfil="logistica" aria-pressed="true">
        <span class="ico">👤</span> Logística</button>
      <button type="button" data-perfil="ti" aria-pressed="false">
        <span class="ico">⚡</span> TI</button>
    </div>

    <div class="erro" id="erro">Usuário ou senha inválidos para este perfil.</div>

    <div class="foot">
      Operando com a <b>UNILOG</b> como transportadora integrada.<br>
      Protótipo — nenhum dado real é enviado.
    </div>
  </form>

  <script>
    // ---- GATE ESTÁTICO (GitHub Pages): valida no navegador, sem POST /login ----
    // No Pages não há servidor: a credencial (1 usuário + 1 senha) vem do gate
    // injetado no build (portal-auth.js). Fora do Pages (servidor real), este bloco
    // não interfere e o POST /login normal do FastAPI segue.
    if (window.PortalGate && PortalGate.ativo()) {
      // 1 usuário/1 senha só: o seletor de perfil (Logística/TI) não se aplica aqui
      document.querySelector(".perfil")?.remove();
      document.querySelector(".brand small").textContent = "Acesso restrito";
      if (PortalGate.autenticado()) location.replace("./");  // já logado → entra direto
      document.querySelector("form.card").addEventListener("submit", async (e) => {
        e.preventDefault();  // no Pages não existe rota /login
        const u = document.getElementById("usuario").value;
        const s = document.getElementById("senha").value;
        if (await PortalGate.validar(u, s)) location.replace("./");
        else document.getElementById("erro").classList.add("show");
      });
    }

    // seletor de perfil (Logística / TI) — atualiza o campo escondido enviado no POST
    const campo = document.getElementById("perfil");
    document.querySelectorAll(".perfil button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".perfil button")
          .forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
        campo.value = b.dataset.perfil;
      });
    });
    // mostra o erro se o backend redirecionou com ?erro=1
    if (new URLSearchParams(location.search).has("erro")) {
      document.getElementById("erro").classList.add("show");
      // preserva o perfil escolhido no redirect (?perfil=ti)
      const p = new URLSearchParams(location.search).get("perfil");
      if (p) document.querySelector(`.perfil button[data-perfil="${p}"]`)?.click();
    }
  </script>
</body>
</html>
