<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Portal da Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./auth.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./portal-auth.js"></script>
<script src="./auth-ui.js"></script>
</head>
<body>
  <form class="card" id="form" autocomplete="on" novalidate>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>
      </span>
      <span><b>Portal da Logística</b></span>
    </div>
    <h1>Entrar</h1>
    <p class="sub" id="sub">Entre com seu e-mail e senha.</p>

    <label for="usuario" id="lbl-usuario">E-mail</label>
    <input id="usuario" name="username" type="text" autocapitalize="none" autocomplete="username"
           inputmode="email" spellcheck="false" required autofocus>

    <label for="senha">Senha</label>
    <input id="senha" name="password" type="password" autocomplete="current-password" required>

    <div class="linha" id="linha-lembrar">
      <label><input type="checkbox" id="lembrar" checked> Manter conectado</label>
      <a href="./esqueci.html" id="lnk-esqueci">Esqueci a senha</a>
    </div>

    <button class="entrar" id="btn" type="submit">Entrar no portal →</button>

    <div class="aviso" id="aviso" role="alert" aria-live="assertive"></div>

    <div class="rodape" id="rodape">Problemas para entrar? Fale com o TI.</div>
    <div class="rodape" id="links-conta">Ainda não tem conta? <a href="./cadastro.html" id="lnk-cadastro">Criar conta</a></div>
  </form>

  <script>
    AuthUI.tema();
    const $ = AuthUI.$;
    // ---- Firebase Auth, e-mail + senha por pessoa (GitHub Pages) ----
    if (!(window.PortalGate && PortalGate.ativo())) {
      // fora do Pages (servidor interno/localhost) não há login: segue direto para o portal
      location.replace("./painel.html");
    } else {
      AuthUI.olho($("#senha"));
      // preserva ?next= nos links das outras telas
      $("#lnk-cadastro").href = AuthUI.comNext("./cadastro.html");
      try { if (sessionStorage.getItem("portal_sem_acesso")) { sessionStorage.removeItem("portal_sem_acesso");
        AuthUI.aviso($("#aviso"), "erro", "Este e-mail não está autorizado. Peça acesso ao TI."); } } catch (_) {}
      PortalGate.pronto.then((u) => { if (u) location.replace(AuthUI.destino()); });   // já logado → entra direto

      $("#form").addEventListener("submit", async (e) => {
        e.preventDefault();                                   // no Pages não existe rota /login
        const em = $("#usuario").value.trim(), sn = $("#senha").value;
        AuthUI.aviso($("#aviso"), "", "");
        AuthUI.dica($("#usuario"), ""); AuthUI.dica($("#senha"), "");
        if (!AuthUI.emailOk(em)) { AuthUI.dica($("#usuario"), "Digite um e-mail válido."); $("#usuario").focus(); return; }
        if (!sn) { AuthUI.dica($("#senha"), "Digite a senha."); $("#senha").focus(); return; }
        const falta = AuthUI.trava.restante();
        if (falta) { AuthUI.aviso($("#aviso"), "erro", AuthUI.msgErro(new Error("bloqueado:" + falta))); return; }
        AuthUI.carregando($("#btn"), true, "Entrando…");
        try {
          await PortalGate.entrar(em, sn, $("#lembrar").checked);
          AuthUI.trava.limpar();
          location.replace(AuthUI.destino());
        } catch (x) {
          if (x.message !== "sem-acesso") AuthUI.trava.falhou();
          AuthUI.carregando($("#btn"), false, "Entrar no portal →");
          AuthUI.aviso($("#aviso"), "erro", AuthUI.msgErro(x, "login"));
        }
      });
    }
  </script>
</body>
</html>
