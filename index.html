<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal da Logística</title>
  <!-- Redirect só para o GitHub Pages em modo "Deploy from a branch" (serve a raiz).
       O portal real fica em static/index.html. O app FastAPI ignora este arquivo. -->
  <meta http-equiv="refresh" content="0; url=./static/">
  <link rel="canonical" href="./static/">
  <script>location.replace("./static/" + location.search + location.hash);</script>
  <style>
    html,body{height:100%;margin:0;background:#0e0d0d;color:#fff;
      font-family:system-ui,Segoe UI,Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center}
    a{color:#31cceb}
  </style>
</head>
<body>
  <p>Redirecionando para o <a href="./static/">Portal da Logística</a>…</p>
</body>
</html>
