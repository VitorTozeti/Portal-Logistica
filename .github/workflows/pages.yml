name: Deploy front (preview) to GitHub Pages

# Publica APENAS o front estático (static/) como preview visual do Portal.
# A FONTE do Pages precisa estar em "GitHub Actions" (Settings -> Pages -> Source).
# ATENÇÃO: é só a UI — não há backend aqui. Sem /api/nfs o front cai no
# static/demo.json (dados fictícios) só para mostrar o visual/design.
# O portal funcional (FastAPI+SSE, dados ao vivo) roda on-prem/Azure, não no Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Gate leve do front: injeta "usuario:sha256(senha)" a partir do secret
      # PORTAL_PAGES_AUTH (formato "usuario:senha"). Sem o secret, o placeholder
      # permanece e o gate fica DESLIGADO (fail-open) — ninguém se tranca fora.
      # ⚠️ Não é segurança forte: o hash fica visível no JS publicado.
      - name: Injeta credencial do gate no front
        env:
          CRED: ${{ secrets.PORTAL_PAGES_AUTH }}
        run: |
          if [ -z "$CRED" ]; then
            echo "PORTAL_PAGES_AUTH não definido — gate DESLIGADO (site público)."
          else
            U="${CRED%%:*}"; P="${CRED#*:}"
            H=$(printf '%s' "$P" | sha256sum | cut -d' ' -f1)
            sed -i "s|__PORTAL_PAGES_AUTH__|${U}:${H}|" static/portal-auth.js
            echo "Gate LIGADO para o usuário '${U}'."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
