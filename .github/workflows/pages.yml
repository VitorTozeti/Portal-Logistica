name: Deploy front (preview) to GitHub Pages

# Publica APENAS o front estático (static/) como preview visual do Portal.
# ATENÇÃO: é só a UI — não há backend aqui. Sem /api/nfs o front cai no
# static/demo.json (dados fictícios) só para mostrar o visual/design.
# O portal funcional (FastAPI+SSE, dados ao vivo) roda on-prem/Azure, não no Pages.

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
